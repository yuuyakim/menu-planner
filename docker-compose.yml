services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: menu_planner
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d menu_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://app:password@db:5432/menu_planner?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      SEARCH_API_PROVIDER: ${SEARCH_API_PROVIDER:-stub}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      # フロントの Vite プロキシ経由だと全リクエストが単一IPに集約され、
      # 正当な操作でもレート制限に達してしまう。開発・E2Eでは 0（無制限）で切る。
      # 本番は実際のクライアントIPが分かる構成で spec 値（10 / 60）を設定する。
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-0}
      SEARCH_RATE_LIMIT_PER_MIN: ${SEARCH_RATE_LIMIT_PER_MIN:-0}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      # ホスト側のtmp/がコンテナのビルド成果物と衝突しないよう分離する
      - backend-tmp:/app/tmp
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modulesはコンテナ内のものを使う（ホストのWindows版と混ざるのを防ぐ）
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  backend-tmp:
