services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: menu_planner
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d menu_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://app:password@db:5432/menu_planner?sslmode=disable
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/google/callback}
      SEARCH_API_PROVIDER: ${SEARCH_API_PROVIDER:-stub}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      INGREDIENT_RESOLVER_PROVIDER: ${INGREDIENT_RESOLVER_PROVIDER:-stub}
      INGREDIENT_RESOLVER_API_KEY: ${INGREDIENT_RESOLVER_API_KEY:-}
      # フロントの Vite プロキシ経由だと全リクエストが単一IPに集約され、
      # 正当な操作でもレート制限に達してしまう。開発・E2Eでは 0（無制限）で切る。
      # 本番は実際のクライアントIPが分かる構成で spec 値（10 / 60）を設定する。
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-0}
      SEARCH_RATE_LIMIT_PER_MIN: ${SEARCH_RATE_LIMIT_PER_MIN:-0}
      # 読み取り（LLM）の日次上限。開発・E2Eでは 0（無制限）で切る。
      # 本番は spec 値（10 / 30 / 300）を設定する。
      RESOLVE_DAILY_LIMIT_ANON: ${RESOLVE_DAILY_LIMIT_ANON:-0}
      RESOLVE_DAILY_LIMIT_USER: ${RESOLVE_DAILY_LIMIT_USER:-0}
      RESOLVE_DAILY_LIMIT_TOTAL: ${RESOLVE_DAILY_LIMIT_TOTAL:-0}
      RESOLVE_IP_HASH_SECRET: ${RESOLVE_IP_HASH_SECRET:-dev-only-secret-do-not-use-in-production}
      # Stripe。3つとも未設定だと起動時に落ちる。開発・CI(E2E)では実際に
      # Checkout/Webhookを叩かないため、ダミー値で起動できれば十分。
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dev_only_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dev_only_placeholder}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-price_dev_only_placeholder}
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      # ホスト側のtmp/がコンテナのビルド成果物と衝突しないよう分離する
      - backend-tmp:/app/tmp
      # Go のビルド/モジュールキャッシュを永続化して service 全体で共有する。
      # `docker compose run --rm backend go run ...`（マイグレーション・seed・
      # E2E の grantPremium）は --rm でコンテナ使い捨てのため、これが無いと
      # 毎回 backend 全体（stripe-go 含む）をフルコンパイルする。E2E は grant を
      # 何度も呼ぶので、キャッシュ非共有だと CI ランナーのCPUを食い潰し、
      # Vite dev の応答が遅れて後半テストが navigation タイムアウトする。
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      BACKEND_ORIGIN: http://backend:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modulesはコンテナ内のものを使う（ホストのWindows版と混ざるのを防ぐ）
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db-data:
  backend-tmp:
  go-build-cache:
  go-mod-cache:
