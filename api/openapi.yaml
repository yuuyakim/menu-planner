openapi: 3.1.0

# API仕様の単一の情報源（spec.md 7章）。
# フロントの型はこのファイルから生成する（frontend: npm run gen:api）。
# エンドポイントを足す・レスポンスを変えるときは、実装より先にここを直すこと。

info:
  title: menu-planner API
  version: 1.0.0
  description: |
    献立提案アプリのREST API。

    認証は HttpOnly Cookie（access_token / refresh_token）で行う。
    エラーはすべて RFC 7807 の problem+json で返す。

servers:
  - url: /
    description: フロントと同一オリジン（Vite dev server が /api を backend に転送する）

tags:
  - name: health
  - name: menus
  - name: auth
  - name: histories
  - name: favorites

paths:
  /health:
    get:
      tags: [health]
      summary: 死活確認
      security: []
      responses:
        '200':
          description: 稼働中
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    examples: [ok]

  /api/v1/menus/suggest:
    get:
      tags: [menus]
      summary: 献立を1件提案する
      description: |
        ログイン中は直近履歴の献立を避け、提案結果を履歴に記録する。
        履歴を避けた結果0件になる場合は、避けずに提案する（spec.md 2.2 ルール3）。
        未認証でも利用できる。
      security: []
      parameters:
        - $ref: '#/components/parameters/GenreQuery'
        - $ref: '#/components/parameters/DifficultyQuery'
        - $ref: '#/components/parameters/RoleQuery'
      responses:
        '200':
          description: 提案された献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 条件に合う献立が無い
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/menus/suggest-weekly:
    post:
      tags: [menus]
      summary: 1週間分（7日）の献立を提案する
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeeklyRequest'
      responses:
        '200':
          description: 7日分の献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 条件に合う献立が足りない
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/menus/reroll-day:
    post:
      tags: [menus]
      summary: 週間献立の指定日だけを引き直す
      description: |
        サーバは週の状態を持たない。現在の週の献立IDを呼び出し側が渡す。
        引き直した結果は履歴に記録しない（確定した献立ではないため）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerollRequest'
      responses:
        '200':
          description: 引き直した1日分の献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: 条件に合う献立が無い
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/menus/{id}:
    get:
      tags: [menus]
      summary: 献立の詳細を取得する
      security: []
      parameters:
        - $ref: '#/components/parameters/MenuIDPath'
      responses:
        '200':
          description: 献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/menus/{id}/recipes:
    get:
      tags: [menus]
      summary: 献立のレシピリンクを取得する
      description: 外部の検索APIを使う。結果0件は障害ではないので 200 で空配列を返す。
      security: []
      parameters:
        - $ref: '#/components/parameters/MenuIDPath'
      responses:
        '200':
          description: レシピリンク（最大3件）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: 外部の検索APIから結果を得られなかった
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/menus/{id}/ingredients:
    get:
      tags: [menus]
      summary: 献立に必要な食材を取得する
      description: |
        調味料は含まない（spec.md 14.4）。分量も持たない（14.2）。
        代表的な食材の例であり、実際の材料はレシピ元で確認する前提。
      security: []
      parameters:
        - $ref: '#/components/parameters/MenuIDPath'
      responses:
        '200':
          description: 食材の一覧（カテゴリ順→カナ順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/menus/search-by-ingredients:
    post:
      tags: [menus]
      summary: 手持ちの食材で作れる献立を探す
      description: |
        選んだ食材を1つでも使う献立を、当てはまり具合とともに返す（spec.md 2.9 / 5.6）。

        完全一致には絞らない。献立1件の食材は平均4.4種で、それを全部持っている
        状況はまれなため、絞ると候補がほぼ0件になる。各候補に不足食材を示すことで
        「あと2品買えば作れる」が分かるようにする。

        並びは「不足の少ない順 → 一致の多い順 → カナ順」。上位20件まで。
        手持ちと1つも重ならない献立は返さない。未認証でも使える。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ingredientIds]
              properties:
                ingredientIds:
                  type: array
                  description: 手持ちの食材。1件以上。重複は1件として扱う。
                  minItems: 1
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: 候補の献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuMatchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/ingredients:
    get:
      tags: [ingredients]
      summary: 食材マスタを全件取得する
      description: |
        手持ちの食材を選ぶ画面の選択肢に使う（spec.md 2.9 / 5.6）。
        並びはカテゴリ順（野菜→肉→魚介→卵乳→主食→その他）、同カテゴリ内はカナ順。
        166件で固定的なため、ページングも検索クエリも設けない。
        未認証でも使える（検索と同じ扱い）。
      security: []
      responses:
        '200':
          description: 食材マスタ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientsResponse'

  /api/v1/shopping-list:
    post:
      tags: [menus]
      summary: 複数の献立から買い物リストを作る
      description: |
        週間献立はサーバに保存していないため、献立IDをリクエストで受け取る。
        同じ食材が複数の献立に出たら1件にまとめ、usedIn にその献立を並べる。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListRequest'
      responses:
        '200':
          description: 買い物リスト（カテゴリ順→カナ順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/auth/signup:
    post:
      tags: [auth]
      summary: メールとパスワードで登録する
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '201':
          description: 登録したユーザー。認証Cookieを設定する。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: メールアドレスが登録済み
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: メールとパスワードでログインする
      description: |
        存在しないメールもパスワード違いも同じ 401 に丸める。
        どちらであるかを返すと、登録済みメールを推測できてしまうため。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: ログインしたユーザー。認証Cookieを設定する。
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: リフレッシュトークンでアクセストークンを再発行する
      description: refresh_token Cookie を使う。このCookieは /api/v1/auth にのみ送られる。
      security: []
      responses:
        '204':
          description: 新しいアクセストークンをCookieに設定した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: ログアウトする
      security: []
      responses:
        '204':
          description: 認証Cookieを破棄した
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'

  /api/v1/auth/google:
    get:
      tags: [auth]
      summary: Google認証を開始する
      description: Googleの同意画面へリダイレクトする。state と PKCE verifier を Cookie に置く。
      security: []
      responses:
        '302':
          description: Googleの認可エンドポイントへのリダイレクト
          headers:
            Location:
              schema:
                type: string
                format: uri

  /api/v1/auth/google/callback:
    get:
      tags: [auth]
      summary: Google認証のコールバック
      description: |
        state を定数時間で照合し、コードをトークンに交換する。
        メール未確認のGoogleアカウントは受け付けない（他人のメールでの乗っ取りを防ぐ）。
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: フロントエンドへのリダイレクト。認証Cookieを設定する。
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              $ref: '#/components/headers/SetAuthCookies'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 現在のユーザーを取得する
      responses:
        '200':
          description: 現在のユーザー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/histories:
    get:
      tags: [histories]
      summary: 検索履歴を新しい順に取得する
      description: 保持されるのは最新15件まで（超過分は自動削除される）。
      responses:
        '200':
          description: 検索履歴
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoriesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [histories]
      summary: 検索履歴を全件削除する
      description: 0件でも成功する（冪等）。
      responses:
        '204':
          description: 削除した
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/histories/{id}:
    delete:
      tags: [histories]
      summary: 検索履歴を1件削除する
      parameters:
        - name: id
          in: path
          required: true
          description: 履歴のID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 他ユーザーの履歴
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/favorites:
    get:
      tags: [favorites]
      summary: お気に入りを新しい順に取得する
      description: 履歴と違い件数の上限が無く、自動削除もされない（spec.md 2.6）。
      responses:
        '200':
          description: お気に入り
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoritesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [favorites]
      summary: お気に入りに献立を追加する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menuId]
              properties:
                menuId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: 追加した
          content:
            application/json:
              schema:
                type: object
                required: [menuId]
                properties:
                  menuId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 同じ献立が既に登録されている
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/favorites/{menuId}:
    delete:
      tags: [favorites]
      summary: お気に入りから献立を外す
      description: |
        自分の (ユーザー, 献立) の行だけを消すため、他人のお気に入りには到達できない。
        自分が登録していない献立は 403 ではなく 404 を返す
        （403 だと他人が何を登録しているかを漏らすため）。
      parameters:
        - name: menuId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/weekly-menus:
    get:
      tags: [weekly-menus]
      summary: 保存した週間献立を新しい順に取得する
      description: |
        中身の7日分を含めて返すため、「開く」ための個別取得は設けていない。
        上限が最大でも50件と小さいのでページングも設けず全件返す（spec.md 2.8 / 2.11 / 5.3）。
      responses:
        '200':
          description: 保存した週間献立
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedWeeklyMenusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [weekly-menus]
      summary: 組み立てた1週間分の献立を保存する
      description: |
        7日分をひとまとまりで保存する（spec.md 2.8）。買い物の場で見返すのが主な用途。

        保存できる件数はプランで決まる（free 10件 / premium 50件、spec.md 2.11）。
        件数は応答に含めず、上限に達したときの 409 の detail に文言として入れて返す。
        クライアントが件数を持つとサーバとの二重管理になるため。

        上限に達した状態での保存は、古いものを押し出さず 409 で断る。
        履歴（FIFO）と違い保存は明示的な操作であり、
        黙って消えると保存という行為の意味が壊れるため。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: array
                  description: 7日分ちょうど。day の重複は不可。
                  minItems: 7
                  maxItems: 7
                  items:
                    type: object
                    required: [day, menuId]
                    properties:
                      day:
                        type: integer
                        minimum: 1
                        maximum: 7
                        description: 起点からの通し番号（spec.md 13.3 の当日起点）。
                      menuId:
                        type: string
                        format: uuid
      responses:
        '201':
          description: 保存した
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            保存の上限に達している。件数はプランで決まるため、
            detail に「保存できるのはN件までです」を入れて返す。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/v1/weekly-menus/{id}:
    delete:
      tags: [weekly-menus]
      summary: 保存した週間献立を削除する
      description: |
        自分の行だけを消すため、他人の保存には到達できない。
        他人のものを指した場合は 403 ではなく 404 を返す（403 だと保存の存在を明かすため）。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 削除した
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/weekly-menus/{id}/shopping-list:
    get:
      tags: [weekly-menus]
      summary: 保存済みの週の買い物リストを取得する
      description: |
        保存済みの週間献立から買い物リストを導出し、差分（チェック・手動品目・非表示）を
        重ねて返す。差分の重ね合わせはサーバで行い、フロントには最終形だけを渡す。
        free でも呼べる（差分が重ならないだけで形は同じ）。他人の週は 404。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 差分適用後の買い物リスト（カテゴリ順→カナ順）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedShoppingListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [weekly-menus]
      summary: 保存済みの週の買い物リストの差分を置き換える
      description: |
        チェック状態・手動品目・非表示を overlay 全体として一括置換する（設計 3.5）。
        品目単位の部分更新はしない。free は 403。手動品目が上限を超えると 409。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShoppingListOverridesRequest'
      responses:
        '204':
          description: 置き換えた
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: プレミアムプランが必要
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 手動品目が上限に達している
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: ログイン時に設定される HttpOnly Cookie。

  parameters:
    GenreQuery:
      name: genre
      in: query
      required: false
      description: 未指定と空文字はどちらも「絞り込まない」。
      schema:
        $ref: '#/components/schemas/Genre'
    DifficultyQuery:
      name: difficulty
      in: query
      required: false
      description: 未指定と空文字はどちらも「絞り込まない」。
      schema:
        $ref: '#/components/schemas/Difficulty'
    RoleQuery:
      name: role
      in: query
      required: false
      description: >-
        **未指定は main（主菜）に絞る。** ジャンル・難易度と違い「すべて」ではない。
        絞り込まない場合は all を明示する（spec.md 2.10）。
      schema:
        $ref: '#/components/schemas/RoleFilter'
    MenuIDPath:
      name: id
      in: path
      required: true
      description: 献立のID
      schema:
        type: string
        format: uuid

  headers:
    SetAuthCookies:
      description: |
        access_token（15分・path=/）と refresh_token（30日・path=/api/v1/auth）。
        いずれも HttpOnly / Secure / SameSite=Lax。
      schema:
        type: string

  responses:
    BadRequest:
      description: リクエストが不正
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 認証が必要、または認証に失敗した
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 対象が存在しない
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Genre:
      type: string
      enum: [japanese, western, chinese, other]
    Difficulty:
      type: string
      enum: [easy, normal, elaborate]
    Role:
      type: string
      description: 献立が一食の中で担う役割（spec.md 2.10）。
      enum: [main, side, soup]
    RoleFilter:
      type: string
      description: >-
        検索での役割の絞り込み。all は「絞り込まない」。
        **省略時は main**で、ジャンル・難易度（省略時はすべて）と意味が違う。
      enum: [main, side, soup, all]
    SearchMode:
      type: string
      enum: [single, weekly]

    Menu:
      type: object
      required: [id, name, genre, difficulty, role, description]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        genre:
          $ref: '#/components/schemas/Genre'
        difficulty:
          $ref: '#/components/schemas/Difficulty'
        role:
          $ref: '#/components/schemas/Role'
        description:
          type: string

    MenuResponse:
      type: object
      required: [menu]
      properties:
        menu:
          $ref: '#/components/schemas/Menu'

    WeeklyRequest:
      type: object
      properties:
        genre:
          oneOf:
            - $ref: '#/components/schemas/Genre'
            - type: 'null'
        difficulty:
          oneOf:
            - $ref: '#/components/schemas/Difficulty'
            - type: 'null'
        role:
          oneOf:
            - $ref: '#/components/schemas/RoleFilter'
            - type: 'null'

    DayMenu:
      type: object
      required: [day, menu]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
        menu:
          $ref: '#/components/schemas/Menu'

    WeeklyResponse:
      type: object
      required: [week]
      properties:
        week:
          type: array
          items:
            $ref: '#/components/schemas/DayMenu'
          minItems: 7
          maxItems: 7

    RerollRequest:
      type: object
      required: [day, week]
      properties:
        day:
          type: integer
          minimum: 1
          maximum: 7
          description: 引き直す日。
        week:
          type: array
          description: 現在の週の献立IDを day 順に並べたもの。
          items:
            type: string
            format: uuid
        genre:
          oneOf:
            - $ref: '#/components/schemas/Genre'
            - type: 'null'
        difficulty:
          oneOf:
            - $ref: '#/components/schemas/Difficulty'
            - type: 'null'
        role:
          oneOf:
            - $ref: '#/components/schemas/RoleFilter'
            - type: 'null'

    Recipe:
      type: object
      required: [title, url, domain, snippet]
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        domain:
          type: string
        snippet:
          type: string

    RecipesResponse:
      type: object
      required: [recipes]
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
          maxItems: 3

    Ingredient:
      type: object
      required: [id, name, nameKana, category]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: 玉ねぎ
        nameKana:
          type: string
          description: 一覧の並び順に使う
          example: たまねぎ
        category:
          type: string
          description: 調味料の分類は持たない（spec.md 14.4）
          enum: [vegetable, meat, seafood, dairy_egg, staple, other]

    IngredientsResponse:
      type: object
      required: [ingredients]
      properties:
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    ShoppingListRequest:
      type: object
      required: [menuIds]
      properties:
        menuIds:
          type: array
          description: 1〜7件。重複は1件として扱う
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 7

    ShoppingItem:
      type: object
      required: [ingredient, usedIn]
      properties:
        ingredient:
          $ref: '#/components/schemas/Ingredient'
        usedIn:
          type: array
          description: |
            その食材を使う献立。分量を持たない設計の補償として、
            何のために買うかを利用者が判断できるようにする。
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string

    ShoppingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShoppingItem'

    Origin:
      type: string
      description: 差分行の由来。derived=献立由来 / manual=手動追加。
      enum: [derived, manual]

    SavedShoppingItem:
      type: object
      required: [name, category, origin, checked, usedIn]
      properties:
        name:
          type: string
        category:
          type: string
          description: 調味料の分類は持たない（spec.md 14.4）
          enum: [vegetable, meat, seafood, dairy_egg, staple, other]
        origin:
          $ref: '#/components/schemas/Origin'
        checked:
          type: boolean
        usedIn:
          type: array
          description: その食材を使う献立。手動品目では空。
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string

    SavedShoppingListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedShoppingItem'

    ShoppingListOverridesRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: overlay 全体。導出品目のチェック/非表示と、手動品目を並べる。
          items:
            type: object
            required: [name, category, origin, checked, hidden]
            properties:
              name:
                type: string
              category:
                type: string
                description: 調味料の分類は持たない（spec.md 14.4）
                enum: [vegetable, meat, seafood, dairy_egg, staple, other]
              origin:
                $ref: '#/components/schemas/Origin'
              checked:
                type: boolean
              hidden:
                type: boolean

    CredentialsRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          description: 8文字以上・72バイト以下。
          minLength: 8

    User:
      type: object
      required: [id, email, displayName, plan]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        plan:
          type: string
          enum: [free, premium]
          description: |
            契約プラン。上限そのものは返さない。フロントが件数を持つと
            サーバとの二重管理になるため、上限に達したことは 409 の本文で伝える。

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    HistoryItem:
      type: object
      required: [id, menu, searchMode, searchedAt]
      properties:
        id:
          type: string
          format: uuid
        menu:
          $ref: '#/components/schemas/Menu'
        searchMode:
          $ref: '#/components/schemas/SearchMode'
        searchedAt:
          type: string
          format: date-time

    HistoriesResponse:
      type: object
      required: [histories]
      properties:
        histories:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'

    FavoriteItem:
      type: object
      required: [menu, createdAt]
      properties:
        menu:
          $ref: '#/components/schemas/Menu'
        createdAt:
          type: string
          format: date-time

    FavoritesResponse:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteItem'

    SavedWeeklyMenu:
      type: object
      description: |
        保存した週間献立1件。中身の7日分をここに含めるため、「開く」ための
        個別取得は要らない。1日分の形は週間献立の提案と同じ DayMenu。
      required: [id, days, createdAt]
      properties:
        id:
          type: string
          format: uuid
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/DayMenu'
        createdAt:
          type: string
          format: date-time

    SavedWeeklyMenusResponse:
      type: object
      required: [weeklyMenus]
      properties:
        weeklyMenus:
          type: array
          items:
            $ref: '#/components/schemas/SavedWeeklyMenu'

    MenuMatch:
      type: object
      description: |
        手持ちの食材に対する献立1件の当てはまり具合。
        matched は手持ちと重なった食材、missing は買い足しが要る食材。
      required: [menu, matched, missing]
      properties:
        menu:
          $ref: '#/components/schemas/Menu'
        matched:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'

    MenuMatchesResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MenuMatch'

    Problem:
      type: object
      description: RFC 7807 の Problem Details。
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: エラー種別を識別するURI。
        title:
          type: string
          description: 人間が読める短い要約。同じ type なら同じ title。
        status:
          type: integer
        detail:
          type: string
          description: この発生に固有の説明。

# 明示的に security: [] を書いたもの以外は認証必須。
security:
  - accessCookie: []
