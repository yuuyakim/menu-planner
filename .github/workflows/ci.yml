name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  # 作業PRでも E2E / 本番イメージ検証を回したいときの手動実行:
  #   gh workflow run CI --ref <ブランチ名>
  workflow_dispatch:

# ドキュメントだけの変更ではCIを走らせない。仕様やタスクの更新だけで
# 4ジョブ・約11分を消費していた（例: PR #107 / #121 はどちらも .md のみ）。
# 必須チェックは設定していないため、走らないことでマージは妨げられない。

# 同一PRへの連続pushでは古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: go.mod が整理済みか確認
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # v6 は golangci-lint v1系(Go 1.24ビルド)を入れるため、go.mod の Go 1.26 を解釈できない。
      # .golangci.yml も v2 形式で書いているため v8 を使う。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

      # testcontainers が実Postgresを起動する。ubuntu-latest には Docker が
      # 入っているため追加のサービス定義は不要。
      # -race はテスト時間をほぼ倍にする（実測 74s のうち相当分）。
      # 作業PR（base が feature/*）では外し、**main に出る経路**
      # ＝ main 宛のPRと main への push では必ず有効にする。
      # 競合はマージ前に必ず一度は検査される。
      - name: テスト
        working-directory: backend
        env:
          RACE: ${{ (github.base_ref == 'main' || github.ref_name == 'main' || github.event_name == 'workflow_dispatch') && '-race' || '' }}
        run: go test ./... $RACE -cover -timeout 10m

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存のインストール
        working-directory: frontend
        run: npm ci

      # 生成物をコミットしているため、openapi.yaml だけ直して再生成し忘れると
      # 型と仕様がずれる。再生成して差分が出たら落とす。
      - name: API型が最新か確認
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      # tsconfig.json は files: [] のプロジェクト参照なので、--noEmit では
      # 何も検査されない（実際にこの構成で型エラーを見逃した）。-b で参照先を辿る。
      - name: 型チェック
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: テスト
        working-directory: frontend
        run: npm test

      - name: ビルド
        working-directory: frontend
        run: npm run build

  # E2E は1実行あたり3.5分と最も重く、しかも中身は
  # 「アプリ起動 132s / ブラウザ導入 37s」に対し実テストは22秒。
  # main に出る経路（main 宛のPR・main への push）だけで走らせる。
  #
  # 作業PRで走らせたいときは workflow_dispatch で手動実行できる:
  #   gh workflow run CI --ref <ブランチ名>
  e2e:
    name: E2E (Playwright)
    if: >-
      github.base_ref == 'main' || github.ref_name == 'main'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 依存のインストール
        working-directory: frontend
        run: npm ci

      # ブラウザ本体は毎回入れると37秒かかる（実測）。package-lock.json を
      # キーにキャッシュする。Playwright の版はそこに固定されるため、
      # 版が変われば自動で別キーになり、バージョン不一致は起きない。
      - name: ブラウザのキャッシュ
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # OSの依存パッケージはキャッシュ対象外なので毎回入れる（数秒）。
      # ブラウザ本体はキャッシュが無いときだけ落とす。
      - name: ブラウザのインストール
        working-directory: frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # アプリ一式（DB・backend・frontend）を起動する。
      # SEARCH_API_PROVIDER は compose の既定が stub なので外部APIは叩かない。
      - name: アプリの起動
        run: docker compose up -d --wait --wait-timeout 300

      - name: マイグレーションと献立マスタの投入
        run: |
          docker compose run --rm backend go run ./cmd/migrate up
          docker compose run --rm backend go run ./cmd/seed

      - name: E2E
        working-directory: frontend
        run: npx playwright test

      - name: 失敗時のレポート
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: 失敗時のログ出力
        if: failure()
        run: docker compose logs

      - name: 後片付け
        if: always()
        run: docker compose down --volumes

  # 本番イメージの検証は main に出る経路だけで行う。
  # 作業PR（base が feature/*）では走らせない。Dockerfile の prod 段は
  # 変更頻度が低く、壊れていれば main 宛の最終PRで必ず捕まる。
  docker:
    name: Docker build
    if: >-
      github.base_ref == 'main' || github.ref_name == 'main'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 本番イメージのビルド
        run: |
          docker build --target prod -t menu-planner-backend:ci ./backend
          docker build --target prod -t menu-planner-frontend:ci ./frontend

      # DBだけ起こす（postgres は取得済みイメージなのでビルドが無い）。
      #
      # 以前はここで `docker compose up backend` していたが、compose の backend は
      # `target: dev` のため、**検証されるのは dev イメージで、直前にビルドした
      # prod イメージは一度も動いていなかった**。しかも E2E ジョブが同じ dev 一式を
      # 起動しており、67秒を二重に払っていた。
      - name: DBの起動
        run: docker compose up -d --wait --wait-timeout 120 db

      # ビルドした prod イメージそのものを動かす。
      # /health はDBを見ないが、起動時のDB接続に失敗するとプロセスが落ちるため、
      # 200 が返ること自体が「本番イメージが起動できる」ことの確認になる。
      - name: 本番イメージの起動と /health の疎通確認
        run: |
          # ネットワーク名は compose のプロジェクト名に依存するため、
          # 名前を決め打ちせず db コンテナから引く。
          network=$(docker inspect "$(docker compose ps -q db)" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          # SEARCH_API_PROVIDER はバイナリ側に既定が無く、未設定だと起動時に落ちる
          # （既定値を与えていたのは compose だった）。ローカル検証で判明。
          docker run -d --name backend-prod --network "$network" \
            -e DATABASE_URL='postgres://app:password@db:5432/menu_planner?sslmode=disable' \
            -e JWT_SECRET='ci-only-secret' \
            -e SEARCH_API_PROVIDER='stub' \
            -e STRIPE_SECRET_KEY='sk_test_ci_placeholder' \
            -e STRIPE_WEBHOOK_SECRET='whsec_ci_placeholder' \
            -e STRIPE_PRICE_ID='price_ci_placeholder' \
            -p 8080:8080 \
            menu-planner-backend:ci
          # --retry だけでは接続リセット/recv失敗を再試行せず、起動直後の listen 前の
          # 一瞬に当たると1発で落ちる（flaky）。接続系エラーも再試行させる。
          curl -fsS --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:8080/health

      - name: 失敗時のログ出力
        if: failure()
        run: |
          docker logs backend-prod || true
          docker compose logs

      - name: 本番コンテナの後片付け
        if: always()
        run: docker rm -f backend-prod || true

      - name: 後片付け
        if: always()
        run: docker compose down -v
