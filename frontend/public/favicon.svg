<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- マスコット「こんたてん」の顔。タブの 16px でも形が残るよう、
       輪郭を太めにし、要素はコック帽・葉っぱ・顔だけに絞っている。
       色は src/index.css の --color-kon-* と同じ値。ただし口だけは
       トークンに無い色で、キャラクターシートの口の色から採っている。 -->
  <rect width="32" height="32" rx="7" fill="#abbc69"/>
  <g transform="translate(1.6 1.6) scale(.9)">
    <g stroke="#724e2d" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
      <!-- コック帽 -->
      <path fill="#fef5e1" d="M7 12C4.2 11.6 3.2 9.6 4.2 8 3.6 5.6 5.8 3.6 8 4.4 9 2.6 11.6 2.2 13 3.6c1.4-1.4 4-1 5 .8 2.2-.8 4.4 1.2 3.8 3.6 1 1.6 0 3.6-2.8 4z"/>
      <!-- 葉っぱ -->
      <path fill="#d0dda5" d="M20.8 13.2C19.9 9.4 21.8 6.3 26.4 5.8c1 3.9-1 7-5.6 7.4z"/>
      <!-- 顔 -->
      <ellipse cx="16" cy="19.5" rx="10" ry="9.4" fill="#fef5e1"/>
    </g>
    <!-- ほお -->
    <ellipse cx="9.5" cy="21.6" rx="1.7" ry="1.2" fill="#f8c4a8"/>
    <ellipse cx="22.5" cy="21.6" rx="1.7" ry="1.2" fill="#f8c4a8"/>
    <!-- 目 -->
    <ellipse cx="12.6" cy="19" rx="1.05" ry="1.4" fill="#724e2d"/>
    <ellipse cx="19.4" cy="19" rx="1.05" ry="1.4" fill="#724e2d"/>
    <!-- 口 -->
    <path fill="#c4703f" d="M13.9 21.6c1.4.5 2.8.5 4.2 0 .2 2.7-4.4 2.7-4.2 0z"/>
  </g>
</svg>
